name: Validar integridade do acervo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar JavaScript e dados estruturados
        run: |
          node --check assets/app.js
          node --check data/seed.js
          python scripts/validate_archive.py
          python -m py_compile scripts/make_seed.py scripts/update_official.py scripts/validate_archive.py